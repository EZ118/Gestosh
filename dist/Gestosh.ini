; Gestosh configuration
; Pixel values are in 96-DPI units and scale with each monitor's DPI.
; Edit this file, then choose "重新加载配置" from the tray menu (or restart).

[general]
; Enable the gesture engine at startup.
enabled=true
; Show a notification-area icon.
tray=true
; Temporarily disable Windows' built-in three-finger swipe so 3-finger drag works.
; The original value is restored when Gestosh exits.
manageThreeFingerGesture=true
; Temporarily disable Windows' built-in four-finger swipe so the 4-finger App Expose gesture works.
manageFourFingerGesture=true
; Global shortcuts: Ctrl+Alt+Shift+D (dock), R (restore), T (toggle).
hotkeys=true

[gestures]
; Exactly three contacts moving together = left-button mouse drag.
threeFingerDrag=true
; Multiplier for cursor movement. 1.0 maps a full touchpad width to ~90% of the monitor width.
dragSensitivity=1.0
; Normalized movement (fraction of the touchpad) required before the drag starts.
dragStartThreshold=0.012
; Five contacts spreading / pinching = dock / restore.
; Set to 4 only if the touchpad reports at most four contacts (Windows' own four-finger gestures may conflict).
pinchFingers=5
; Current RMS spread divided by the spread when the five fingers settled.
pinchOutRatio=1.35
pinchInRatio=0.74
; Minimum absolute change of the RMS spread (normalized) before a trigger.
pinchMinTravel=0.045
; Wait this long after five contacts are seen before measuring the base spread.
pinchSettleMs=60
; Ignore a new pinch trigger for this long after the previous one.
gestureCooldownMs=350
; Four-finger downward/upward distance (fraction of the touchpad) that drives App Expose.
exposeSwipeDistance=0.16
; Require vertical movement to be at least this multiple of horizontal movement.
exposeSwipeVerticalRatio=1.5
; A swipe slower than this is not treated as an App Expose swipe.
exposeSwipeMaxMs=900
; Four fingers moving sideways slide the previous/next virtual desktop in.
desktopSwipe=true
; Screen pixels per normalized touchpad unit (1.0 = one screen width per touchpad width).
desktopSwipeGain=1.0
; Horizontal travel (fraction of the touchpad) before the slide starts.
desktopSwipeStartDistance=0.012
; Fraction of the screen that must be revealed before the desktop really switches.
desktopSwipeCommitRatio=0.30
; Gesture mappings (also editable from the tray menu: 手势设置...).
; threeFingerAction: none | drag
; fourFingerDownAction: none | expose | taskview
; fourFingerUpAction: none | expose | taskview
; fourFingerHorizontalAction: none | desktop
; edgeSwipeAction: none | actioncenter
threeFingerAction=drag
fourFingerDownAction=expose
fourFingerUpAction=taskview
fourFingerHorizontalAction=desktop
edgeSwipeAction=actioncenter

[animation]
; Duration of the dock/restore transition. 0 = instant.
durationMs=340
; Animation frame rate.
fps=60
; Duration of the final desktop slide after the fingers are released.
desktopSwipeSettleMs=170

[dock]
; How many pixels of each window remain visible at the screen edge (96-DPI units).
exposePx=42
; Gap between windows placed along the same edge (96-DPI units).
stackStepPx=10
; Upper bound for the exposed depth.
maxExposePx=220
; Usually skip tool windows.
includeToolWindows=false
; Minimized windows are left alone.
includeMinimized=false
; Optional comma-separated process names (without .exe). Empty = all eligible windows.
onlyProcesses=
excludeProcesses=
